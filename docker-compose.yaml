services:
  feed-simulator:
    build: .
    container_name: feed-simulator
    restart: unless-stopped
    ports:
      - "${SIM_PORT:-6030}:6030"
    environment:
      SIM_DATA_ROOT: /data
    volumes:
      # Must be the tiles-processor data dir (seed/ + watched input dirs).
      # A single mount keeps everything on one filesystem so hardlinks work.
      - ${TILES_DATA_DIR:-../tiles-processor/data}:/data
      # Tunables live here; edit + restart, no rebuild. Any value can also be
      # overridden with a SIM_* env var (see README).
      - ./settings.json:/app/settings.json:ro
