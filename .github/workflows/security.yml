name: Security scan

# Runs on main: the full test suite (gitleaks + pytest, reused from test.yml)
# plus a Trivy image vulnerability scan. No deploy here — data-simulator is a
# dev tool deployed by cloning onto the VPS, not through a prod pipeline.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image-scan:
    name: vulnerabilities scan (trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t data-simulator:scan .
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
      - name: Scan image for vulnerabilities
        run: |
          trivy image --download-db-only
          trivy image --ignorefile .trivyignore.yaml --format table --exit-code 0 --severity HIGH --scanners vuln,misconfig,license --skip-db-update data-simulator:scan
          trivy image --ignorefile .trivyignore.yaml --format table --exit-code 1 --severity CRITICAL --scanners vuln,misconfig,license --skip-db-update --quiet data-simulator:scan
